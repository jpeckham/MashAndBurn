name: Companion safety and private notifications

on:
  push:
    branches: [main, 'codex/**']
    paths: ['companion/**', '.github/workflows/companion.yml']
  pull_request:
    paths: ['companion/**', '.github/workflows/companion.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: companion/requirements*.txt
      - name: Install pinned companion dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          mkdir -p .tools/evidence
          python -m pip freeze > .tools/evidence/dependencies.txt
      - name: Validate interlocks and private notification boundaries
        run: python -m pytest --junitxml=.tools/evidence/tests.xml -q
      - name: Preserve companion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-safety-evidence
          path: companion/.tools/evidence/
          if-no-files-found: warn
