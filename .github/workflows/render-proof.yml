name: Hosted rendered garage proof

on:
  push:
    branches: ['codex/**']
    paths: ['tests/**', 'src/**', 'scenes/**', 'project.godot', '.github/workflows/render-proof.yml']
  workflow_dispatch:
    inputs:
      pair:
        description: Run two real windows with full production-speed brewing and fire traversal
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  garage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GODOT_VERSION: '4.4.1'
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display and software rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers vulkan-tools mesa-utils libxrandr2 libxi6 libxinerama1 libxcursor1
      - name: Install checksum-verified official Godot
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$RUNNER_TEMP/godot-render"
          mkdir -p "$toolchain" .tools/render-proof
          cd "$toolchain"
          asset="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/$asset" -o "$asset"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          awk -v file="$asset" '$2 == file {print}' SHA512-SUMS.txt > selected-checksum.txt
          test "$(wc -l < selected-checksum.txt)" -eq 1
          sha512sum --check selected-checksum.txt
          unzip -q "$asset"
          executable="$toolchain/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$executable"
          echo "GODOT=$executable" >> "$GITHUB_ENV"
      - name: Import and render actual UI input walkthrough
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --version | tee .tools/render-proof/toolchain.txt
          timeout 90s "$GODOT" --headless --editor --path . --quit > .tools/render-proof/import.log 2>&1
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' .tools/render-proof/import.log; then exit 1; fi
          timeout 90s "$GODOT" --headless --path . --script tests/run_all.gd 2>&1 | tee .tools/render-proof/tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' .tools/render-proof/tests.log; then exit 1; fi
          grep -E '^RESULT: [1-9][0-9]* checks, 0 failures$' .tools/render-proof/tests.log
          xvfb-run -a -s '-screen 0 1600x1000x24' timeout 360s "$GODOT" --path . --display-driver x11 --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --max-fps 60 --script tests/render/render_proof.gd 2>&1 | tee .tools/render-proof/walkthrough.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' .tools/render-proof/walkthrough.log; then exit 1; fi
          python3 -c "import json; p=json.load(open('.tools/render-proof/manifest.json')); assert p['exit_code']==0 and p['failures']==0 and len(p['captures'])>=16, p"
          (cd .tools/render-proof && sha256sum *.png > SHA256SUMS.txt)
      - name: Render actual host and guest multiplayer walkthrough
        if: github.event_name == 'workflow_dispatch' && inputs.pair
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 3000x1000x24' bash tests/render/run_pair.sh
      - name: Render fixed-camera beer and thermal comparisons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/visual-proof
          for renderer in gl_compatibility forward_plus; do
            if [[ "$renderer" == forward_plus ]]; then
              mapfile -t drivers < <(compgen -G '/usr/share/vulkan/icd.d/lvp*.json')
              test "${#drivers[@]}" -eq 1
              export VK_ICD_FILENAMES="${drivers[0]}"
            fi
            xvfb-run -a -s '-screen 0 1600x1000x24' timeout 150s "$GODOT" --path . --display-driver x11 --rendering-method "$renderer" --audio-driver Dummy --max-fps 60 --script tests/render/visual_comparison.gd -- --expected-renderer "$renderer" 2>&1 | tee ".tools/visual-proof/$renderer.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' ".tools/visual-proof/$renderer.log"; then exit 1; fi
            python3 -c "import json; p=json.load(open('.tools/visual-proof/$renderer/manifest.json')); assert len(p['captures'])==5 and p['profile']['fps']>0 and p['profile']['renderer']=='$renderer', p"
            (cd ".tools/visual-proof/$renderer" && sha256sum *.png > SHA256SUMS.txt)
          done
      - name: Preserve frames, provenance and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-garage-proof
          path: .tools/render-proof/
          if-no-files-found: error
      - name: Preserve multiplayer frames and role logs
        if: always() && github.event_name == 'workflow_dispatch' && inputs.pair
        uses: actions/upload-artifact@v4
        with:
          name: rendered-multiplayer-proof
          path: .tools/multiplayer-proof/
          if-no-files-found: warn
      - name: Preserve optics and thermal comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-visual-comparisons
          path: .tools/visual-proof/
          if-no-files-found: warn
