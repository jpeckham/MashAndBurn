name: Godot validation and Windows MSI

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
    paths: ['src/**', 'scenes/**', 'tests/**', 'project.godot', 'export_presets.cfg', 'licenses/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**', 'scenes/**', 'tests/**', 'project.godot', 'export_presets.cfg', 'licenses/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    permissions:
      contents: write
    uses: jpeckham/.github/.github/workflows/godot-windows-msi.yml@4cb6cb2fd6650354d6c51305e5d60696d1171b57
    with:
      library_ref: 4cb6cb2fd6650354d6c51305e5d60696d1171b57
      godot_version: '4.4.1'
      product_name: Mash & Burn
      executable: MashAndBurn.exe
      artifact_prefix: mash-and-burn
      upgrade_code: 4e16f2b9-c90a-43bd-93be-970bda650e19
      publish_release: true
